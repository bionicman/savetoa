name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build Ubuntu 26.04 test image
        run: docker build --tag savetoa-test .
      - name: Run checks
        run: docker run --rm savetoa-test
      - name: Run race detector
        run: docker run --rm savetoa-test go test -race ./...
      - name: Build binary
        run: docker run --rm savetoa-test make build

  debian:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.1"
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential debhelper devscripts golang-any lintian
      - name: Build Debian package
        run: dpkg-buildpackage -us -uc -b
      - name: Lint Debian package
        run: lintian --profile debian ../savetoa_*.changes

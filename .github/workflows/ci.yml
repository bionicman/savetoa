name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Build
        run: go build -trimpath ./cmd/savetoa

  debian:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes debhelper devscripts golang-any lintian
      - name: Build Debian package
        run: dpkg-buildpackage -us -uc -b
      - name: Lint Debian package
        run: lintian --profile debian ../savetoa_*.changes

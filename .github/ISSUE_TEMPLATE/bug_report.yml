name: Bug report
description: Report a reproducible SaveToA defect
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private backup data, or undisclosed vulnerabilities.
  - type: input
    id: version
    attributes:
      label: SaveToA version
      placeholder: savetoa version output
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Redact all credentials and private data.
    validations:
      required: true

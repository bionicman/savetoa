config_version: 1
environment: example

targets:
  example-mariadb:
    driver: mariadb

    credentials:
      file: /etc/savetoa/credentials.d/example-mariadb.cnf

    source:
      socket: /run/mysqld/mysqld.sock
      replica:
        required: true
        source_host: db-primary.internal
        source_port: 3306
        source_user: backup_replication
        require_gtid: true
        max_lag: 5m

    capture:
      prepare: true
      safe_replica_backup: true
      use_memory: 512M

    compression:
      driver: zstd
      level: 3

    encryption:
      driver: age
      recipients_file: /etc/savetoa/recipients.d/example.age

    destinations:
      local:
        driver: local
        path: /var/backups/savetoa

      offsite:
        driver: s3
        credentials:
          file: /etc/savetoa/credentials.d/offsite-s3.yml
        maintenance_credentials:
          file: /etc/savetoa/maintenance-credentials.d/offsite-s3.yml
        endpoint: https://s3.example.invalid
        region: eu-west-1
        bucket: example-backups
        prefix: databases

    retention:
      keep_daily: 14
      keep_weekly: 8
      keep_monthly: 12

  example-mongodb:
    driver: mongodb

    credentials:
      file: /etc/savetoa/credentials.d/example-mongodb.yml

    source:
      host: 127.0.0.1
      port: 27017
      username: savetoa_backup
      authentication_database: admin
      replica:
        required: true
        set_name: example-production
        require_secondary: true
        require_hidden: true
        require_non_voting: true
        require_priority_zero: true
        max_lag: 5m

    capture:
      full: true
      oplog: true

    compression:
      driver: zstd
      level: 3

    encryption:
      driver: age
      recipients_file: /etc/savetoa/recipients.d/example.age

    destinations:
      local:
        driver: local
        path: /var/backups/savetoa

      offsite:
        driver: s3
        credentials:
          file: /etc/savetoa/credentials.d/offsite-s3.yml
        maintenance_credentials:
          file: /etc/savetoa/maintenance-credentials.d/offsite-s3.yml
        endpoint: https://s3.example.invalid
        region: eu-west-1
        bucket: example-backups
        prefix: databases

  example-redis:
    driver: redis

    credentials:
      file: /etc/savetoa/credentials.d/example-redis.yml

    source:
      host: 127.0.0.1
      port: 6379
      username: savetoa_backup
      rdb_file: /var/lib/redis/dump.rdb
      replica:
        required: true
        source_host: redis-primary.internal
        source_port: 6379
        require_read_only: true
        require_priority_zero: true
        max_lag: 5s

    capture:
      bgsave: true
      schedule: true
      max_wait: 10m

    compression:
      driver: zstd
      level: 3

    encryption:
      driver: age
      recipients_file: /etc/savetoa/recipients.d/example.age

    destinations:
      local:
        driver: local
        path: /var/backups/savetoa

      offsite:
        driver: s3
        credentials:
          file: /etc/savetoa/credentials.d/offsite-s3.yml
        maintenance_credentials:
          file: /etc/savetoa/maintenance-credentials.d/offsite-s3.yml
        endpoint: https://s3.example.invalid
        region: eu-west-1
        bucket: example-backups
        prefix: databases

  example-files:
    driver: tar

    source:
      paths:
        - /etc/example-state
        - /var/lib/example-state

    compression:
      driver: zstd
      level: 3

    encryption:
      driver: age
      recipients_file: /etc/savetoa/recipients.d/example.age

    destinations:
      local:
        driver: local
        path: /var/backups/savetoa

groups:
  example-databases:
    targets:
      - example-mariadb
      - example-mongodb
      - example-redis
  example-filesystems:
    targets:
      - example-files
